steps:
  # 1. Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agrogame-notifications-dev:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agrogame-notifications-dev:latest'
      - '.'

  # 2. Push para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agrogame-notifications-dev:$SHORT_SHA'

  # 3. Deploy no Cloud Run (Instância de DEV)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agrogame-notifications-dev'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agrogame-notifications-dev:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--service-account=bitbucket-deployer@$PROJECT_ID.iam.gserviceaccount.com'
      - '--update-env-vars=SPRING_PROFILES_ACTIVE=dev'
      - '--update-secrets=RESEND_API_KEY=dev-resend-api-key:latest'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--quiet'

timeout: '3600s'

options:
  logging: CLOUD_LOGGING_ONLY